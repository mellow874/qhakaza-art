services:
  postgres:
    image: postgres:16-alpine
    container_name: qhakaza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qhakaza
      POSTGRES_PASSWORD: qhakaza
      POSTGRES_DB: qhakaza_art
    ports:
      - '5432:5432'
    volumes:
      - qhakaza-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qhakaza -d qhakaza_art']
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database used by the test suite so local dev data is never wiped.
  postgres-test:
    image: postgres:16-alpine
    container_name: qhakaza-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: qhakaza
      POSTGRES_PASSWORD: qhakaza
      POSTGRES_DB: qhakaza_art_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  qhakaza-pgdata:
